<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinovia — Stream Movies & TV Shows</title>
  <meta name="description" content="Cinovia — browse trending titles, search your favorites, and stream movies & TV shows instantly in HD." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta property="og:title" content="Cinovia — Stream Movies & TV Shows" />
  <meta property="og:description" content="Browse trending titles, search your favorites, and stream movies & TV shows instantly in HD." />
  <meta property="og:type" content="website" />
</head>
<body>
  <!-- Navigation -->
  <nav id="navbar">
    <div class="nav-inner">
      <a href="#" class="logo" id="logo-link">
        <span class="logo-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5l12 7-12 7z"/></svg></span>
        <span class="logo-text">Cin<span class="accent">ovia</span></span>
      </a>
      <div class="nav-links" id="nav-links">
        <a href="#" data-nav="home" class="nav-link active">Home</a>
        <a href="#" data-nav="movies" class="nav-link">Movies</a>
        <a href="#" data-nav="tv" class="nav-link">TV Shows</a>
      </div>
      <div class="nav-right">
        <div class="search-box" id="search-box">
          <input type="text" id="search-input" placeholder="Search movies & shows..." autocomplete="off" />
          <button id="search-btn" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <div id="search-dropdown" class="search-dropdown hidden"></div>
        </div>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="app">
    <!-- Home View -->
    <section id="view-home" class="view active">
      <div id="hero-banner" class="hero-banner">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content" id="hero-content"></div>
      </div>
      <div class="container">
        <div class="section-row" id="trending-movies-row"></div>
        <div class="section-row" id="trending-tv-row"></div>
        <div class="section-row" id="top-rated-row"></div>
      </div>
    </section>

    <!-- Browse View (Movies or TV) -->
    <section id="view-browse" class="view">
      <div class="container">
        <div class="browse-header">
          <h1 id="browse-title"></h1>
          <div class="genre-chips" id="genre-chips"></div>
        </div>
        <div class="card-grid" id="browse-grid"></div>
        <div class="load-more-wrap">
          <button id="load-more-btn" class="btn-glow hidden">Load More</button>
        </div>
      </div>
    </section>

    <!-- Search Results View -->
    <section id="view-search" class="view">
      <div class="container">
        <h1 id="search-results-title" class="section-title"></h1>
        <div class="card-grid" id="search-grid"></div>
      </div>
    </section>

    <!-- Detail / Watch View -->
    <section id="view-detail" class="view">
      <div id="detail-backdrop" class="detail-backdrop"></div>
      <div class="detail-overlay"></div>
      <div class="container detail-container">
        <div id="detail-content"></div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="footer">
    <div class="container footer-inner">
      <p class="footer-brand">
        <span class="logo-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5l12 7-12 7z"/></svg></span> Cin<span class="accent">ovia</span>
      </p>
      <div class="footer-meta">
        <p class="footer-copy">&copy; 2026 Cinovia. For educational purposes only.</p>
        <p class="footer-credit">Made by Ammar</p>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
